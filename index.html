<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>青柠学园 · 智慧校园管理系统</title>
<meta name="description" content="青柠学园智慧校园管理系统 —— 课程、成绩、考勤、社团，一本手账全管好。" />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FFB7C9' stroke='%232F2A3A' stroke-width='2.5'/%3E%3Cpath d='M9 21c3-2 5-8 7-9s4 4 7 3' stroke='%232F2A3A' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>

<!-- 纸张肌理：不挡事件 -->
<div class="paper-grain" aria-hidden="true"></div>

<!-- 手绘涂鸦背景 -->
<svg class="doodles" aria-hidden="true" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <g stroke="#2F2A3A" stroke-opacity=".16" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M1120 96c14-16 44-12 46 8 2 18-24 26-34 12-9-13 10-26 26-22 22 5 28 28 16 42" />
    <path d="M130 640c10-14 32-10 34 6 2 15-18 22-26 10-7-11 8-21 20-18 17 4 22 22 12 33" />
    <path d="M1244 690l16 16M1260 690l-16 16M1232 706l16 16M1248 706l-16 16" />
    <path d="M420 60l5 14 14 5-14 5-5 14-5-14-14-5 14-5z" />
    <path d="M960 812l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" />
    <path d="M120 250c22-8 44 2 48 22s-14 34-30 26" />
    <path d="M1330 300c-18 6-24 30-8 40s34-4 28-18" />
  </g>
</svg>

<div class="app" id="app">

  <!-- ============ 左侧活页线圈侧栏 ============ -->
  <aside class="rail">
    <div class="rail-coils" aria-hidden="true"></div>

    <a class="rail-brand" href="#overview" data-nav="overview">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="40" height="40" fill="none">
          <rect x="2.5" y="2.5" width="35" height="35" rx="11" fill="#FFB7C9" stroke="#2F2A3A" stroke-width="2.5"/>
          <path d="M11 27c3.5-2.5 6-9 8.5-10.5S24 21 29 20" stroke="#2F2A3A" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="15" cy="14.5" r="1.6" fill="#2F2A3A"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>青柠学园</strong>
        <em>LIME CAMPUS</em>
      </span>
    </a>

    <nav class="rail-nav" id="rail-nav" aria-label="主导航"></nav>

    <div class="rail-foot">
      <div class="id-card">
        <span class="id-card__pin" aria-hidden="true"></span>
        <p class="id-card__label">学期编号</p>
        <p class="id-card__value">2026 · 秋</p>
        <p class="id-card__meta">第 10 教学周</p>
      </div>
    </div>
  </aside>

  <!-- ============ 主区域 ============ -->
  <main class="stage">

    <header class="topbar">
      <div class="topbar__left">
        <p class="topbar__eyebrow" id="page-eyebrow">今日天气 · 晴 18°C</p>
        <h1 class="topbar__title" id="page-title">总览</h1>
      </div>

      <div class="topbar__right">
        <div class="search" role="search">
          <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/>
          </svg>
          <input id="search-input" type="search" placeholder="搜课程 / 社团 / 通知…" aria-label="搜索" autocomplete="off" />
          <kbd>/</kbd>
          <div class="search__drop" id="search-drop" hidden></div>
        </div>

        <div class="stamp" id="date-stamp" aria-label="今天是 11 月 2 日，星期一">
          <span class="stamp__day">02</span>
          <span class="stamp__mon">NOV<br/>周一</span>
        </div>

        <button class="icon-btn" id="bell-btn" aria-label="通知，有 3 条未读" aria-expanded="false" aria-controls="notice-drawer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 9a6 6 0 10-12 0c0 5-2 6-2 6h16s-2-1-2-6"/>
            <path d="M10.5 20a2 2 0 003 0"/>
          </svg>
          <span class="icon-btn__dot" aria-hidden="true">3</span>
        </button>

        <button class="me" id="me-btn" aria-label="打开个人中心">
          <span class="me__avatar" aria-hidden="true">
            <svg viewBox="0 0 48 48" width="46" height="46" fill="none">
              <circle cx="24" cy="24" r="22" fill="#FFE7B8"/>
              <path d="M8 24c0-10 7-16 16-16s16 6 16 16v9c0 3-2 5-5 5H13c-3 0-5-2-5-5z" fill="#3A3040"/>
              <path d="M12 25c0-7 5-12 12-12s12 5 12 12v6c0 2-2 4-4 4H16c-2 0-4-2-4-4z" fill="#FFE0C2"/>
              <path d="M12.5 24c1.5-6 5.5-9 11.5-9s10 3 11.5 9c-3-3-6.5-4.5-11.5-4.5S15.5 21 12.5 24z" fill="#3A3040"/>
              <circle cx="19" cy="26" r="1.8" fill="#2F2A3A"/>
              <circle cx="29" cy="26" r="1.8" fill="#2F2A3A"/>
              <path d="M21.5 30.5c1.6 1.4 3.4 1.4 5 0" stroke="#2F2A3A" stroke-width="1.8" stroke-linecap="round"/>
              <circle cx="16" cy="29" r="2" fill="#FFB7C9" opacity=".85"/>
              <circle cx="32" cy="29" r="2" fill="#FFB7C9" opacity=".85"/>
              <path d="M38 12l1.6 4.4L44 18l-4.4 1.6L38 24l-1.6-4.4L32 18l4.4-1.6z" fill="#FFE08A" stroke="#2F2A3A" stroke-width="1.4"/>
            </svg>
          </span>
          <span class="me__txt">林小满</span>
        </button>
      </div>
    </header>

    <!-- 页面内容由 app.js 渲染 -->
    <div class="view" id="view" tabindex="-1"></div>

    <footer class="stage-foot">
      <svg class="stage-foot__wave" viewBox="0 0 120 12" aria-hidden="true" fill="none" stroke="#2F2A3A" stroke-width="2" stroke-linecap="round">
        <path d="M2 8c6-6 12 0 18-2s12 4 18 2 12-4 18-2 12 4 18 2 12-4 18-2"/>
      </svg>
      <p>青柠学园 · 学生端 v2.6 ——「把每一天都记在小本本上」</p>
    </footer>
  </main>
</div>

<!-- 通知抽屉 -->
<div class="drawer-wrap" id="notice-drawer" hidden>
  <div class="drawer" role="dialog" aria-label="通知中心">
    <div class="drawer__head">
      <h2>通知中心</h2>
      <button class="icon-btn icon-btn--sm" id="drawer-close" aria-label="关闭通知中心">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="drawer__body" id="drawer-list"></div>
  </div>
</div>

<!-- 通用弹窗 -->
<div class="modal-wrap" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal-box"></div>
</div>

<!-- 轻提示 -->
<div class="toast-wrap" id="toast" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
